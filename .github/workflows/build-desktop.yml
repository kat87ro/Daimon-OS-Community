name: Build Desktop

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: "22.14.0"

jobs:
  checks:
    name: Typecheck and release-policy checks
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'ci' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm --dir source install --frozen-lockfile
      - name: Enforce immutable action references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('.github/workflows').filter((name) => /\.ya?ml$/.test(name));
          const invalid = [];
          for (const file of files) {
            for (const [index, line] of fs.readFileSync(`.github/workflows/${file}`, 'utf8').split('\n').entries()) {
              const match = line.match(/\buses:\s*\S+@([^\s#]+)/);
              if (match && !/^[0-9a-f]{40}$/.test(match[1])) invalid.push(`${file}:${index + 1}: ${match[1]}`);
            }
          }
          if (invalid.length) {
            console.error(`Actions must use immutable full-SHA refs:\n${invalid.join('\n')}`);
            process.exit(1);
          }
          NODE
      - name: Enforce production release tag and Linux signing anchor
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('source/apps/desktop/package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match desktop version v${pkg.version}`);
          }
          NODE
          node source/apps/desktop/scripts/verify-linux-signing-anchor.mjs
      - run: pnpm --dir source typecheck

  build-web:
    name: Build web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm --dir source install --frozen-lockfile
      - run: pnpm --dir source --filter @daimon-os/desktop build:web
        env:
          DAIMON_DESKTOP: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-out
          path: source/apps/web/out
          retention-days: 1

  bundle-runtime:
    name: Bundle gateway and MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm --dir source install --frozen-lockfile
      - run: pnpm --dir source --filter @daimon-os/desktop bundle:all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-runtime
          path: |
            source/apps/desktop/src/gateway.mjs
            source/apps/desktop/src/mcp-server.mjs
          retention-days: 1

  build-macos:
    name: macOS universal
    needs: [checks, build-web, bundle-runtime]
    runs-on: macos-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'ci' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm --dir source install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-out
          path: source/apps/web/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-runtime
          path: source/apps/desktop/src
      - name: Assert runtime bundles
        run: test -s source/apps/desktop/src/gateway.mjs && test -s source/apps/desktop/src/mcp-server.mjs
      - name: Build unsigned macOS artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm --dir source --filter @daimon-os/desktop exec electron-builder --mac --universal --config.directories.output=../../../app/Mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Require macOS signing inputs
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "::error::Missing required signing input: ${name}"; exit 1; }
          done
      - name: Build signed and notarized macOS artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: pnpm --dir source --filter @daimon-os/desktop exec electron-builder --mac --universal --config.directories.output=../../../app/Mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DAIMON_REQUIRE_SIGNING: "1"
      - name: Verify macOS signature and notarization
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          APP_PATH=$(find app/Mac -type d -name 'Daimon OS.app' -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: app/Mac/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows x64
    needs: [checks, build-web, bundle-runtime]
    runs-on: windows-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'ci' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm --dir source install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-out
          path: source/apps/web/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-runtime
          path: source/apps/desktop/src
      - name: Assert runtime bundles
        shell: pwsh
        run: |
          if (!(Test-Path source/apps/desktop/src/gateway.mjs) -or !(Test-Path source/apps/desktop/src/mcp-server.mjs)) { throw 'Missing runtime bundle' }
      - name: Build unsigned Windows artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm --dir source --filter @daimon-os/desktop exec electron-builder --win --x64 --config.directories.output=../../../app/Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Require Windows signing inputs
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) { throw 'Missing WIN_CSC_LINK' }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) { throw 'Missing WIN_CSC_KEY_PASSWORD' }
      - name: Build signed Windows artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: pnpm --dir source --filter @daimon-os/desktop exec electron-builder --win --x64 --config.directories.output=../../../app/Windows
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Windows Authenticode signature
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $installers = Get-ChildItem app/Windows/*.exe
          if ($installers.Count -eq 0) { throw 'No Windows installer produced' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on $($installer.Name): $($signature.Status)" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-exe
          path: app/Windows/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux AppImage
    needs: [checks, build-web, bundle-runtime]
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'ci' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm --dir source install --frozen-lockfile
      - run: sudo apt-get update -y && sudo apt-get install -y libopenjp2-tools rpm fakeroot
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-out
          path: source/apps/web/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-runtime
          path: source/apps/desktop/src
      - run: test -s source/apps/desktop/src/gateway.mjs && test -s source/apps/desktop/src/mcp-server.mjs
      - run: pnpm --dir source --filter @daimon-os/desktop exec electron-builder --linux --x64 --config.directories.output=../../../app/Linux
      - name: Require Linux signing inputs
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
          LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          test -n "$LINUX_SIGNING_PRIVATE_KEY" || { echo "::error::Missing LINUX_SIGNING_PRIVATE_KEY"; exit 1; }
          [[ "$LINUX_SIGNING_KEY_FINGERPRINT" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "::error::LINUX_SIGNING_KEY_FINGERPRINT must be a SHA-256 hex digest"
            exit 1
          }
      - name: Create and verify Linux integrity bundle
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
          LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$LINUX_SIGNING_PRIVATE_KEY" > "$key_file"
          openssl pkey -in "$key_file" -pubout -out app/Linux/linux-signing-public-key.pem
          node source/apps/desktop/scripts/verify-linux-signing-anchor.mjs \
            app/Linux/linux-signing-public-key.pem
          (
            cd app/Linux
            LC_ALL=C sha256sum -- *.AppImage > SHA256SUMS
          )
          openssl dgst -sha256 -sign "$key_file" \
            -out app/Linux/SHA256SUMS.sig app/Linux/SHA256SUMS
          openssl dgst -sha256 -verify app/Linux/linux-signing-public-key.pem \
            -signature app/Linux/SHA256SUMS.sig app/Linux/SHA256SUMS
          (cd app/Linux && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: linux-appimage
          path: app/Linux/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: linux-appimage
          path: |
            app/Linux/*.AppImage
            app/Linux/SHA256SUMS
            app/Linux/SHA256SUMS.sig
            app/Linux/linux-signing-public-key.pem
          if-no-files-found: error

  publish-release:
    name: Publish verified release artifacts
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-dmg"
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-exe"
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-appimage"
          path: release
          merge-multiple: true
      - name: Verify Linux integrity bundle before publication
        shell: bash
        env:
          LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$LINUX_SIGNING_KEY_FINGERPRINT" =~ ^[0-9a-fA-F]{64}$ ]]
          node source/apps/desktop/scripts/verify-linux-signing-anchor.mjs \
            release/linux-signing-public-key.pem
          openssl dgst -sha256 -verify release/linux-signing-public-key.pem \
            -signature release/SHA256SUMS.sig release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
